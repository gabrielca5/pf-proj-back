name: deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/pf-back:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build e testes
        run: mvn -B package

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy na AWS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo docker network create rede || true
            sudo docker start postgres || sudo docker run -d --name postgres --network rede --restart unless-stopped -e POSTGRES_DB=pf -e POSTGRES_PASSWORD=postgres -v pgdata:/var/lib/postgresql/data postgres:17
            sudo docker pull ${{ env.IMAGE }}
            sudo docker rm -f pf-back || true
            sudo docker run -d --name pf-back --network rede --restart unless-stopped -p 8080:8080 -e DB_URL=jdbc:postgresql://postgres:5432/pf ${{ env.IMAGE }}
