# Banco (no deploy o DB_URL vem por variavel de ambiente, ver deploy.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pf}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Auth0: TROCAR pelo seu domain e pelo identifier da API
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://TROCAR-DOMAIN.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://pf-api

# ---- Erros mais faceis de ler ----
# Console: so avisos e erros do Spring, tudo do seu codigo, com cor (ERROR em vermelho)
spring.main.banner-mode=off
spring.output.ansi.enabled=always
logging.level.root=WARN
logging.level.br.insper=DEBUG
logging.pattern.console=%clr(%-5level) %clr(%logger{0}){cyan} %msg%n%rEx{6}
# Resposta HTTP: mostra a mensagem do erro e qual campo falhou na validacao
server.error.include-message=always
server.error.include-binding-errors=always
# Descomente quando der 401/403 e voce nao souber o motivo
